name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.0
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@lance-ventures"
      - run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: npm run check
      - run: npx --no-install sdlc generate --check
      - run: npx --no-install sdlc conformance --all --source-sha "$GITHUB_SHA"
      - run: test ! -e .agents
