version: 2

definitions:
  phases:
    scout:
      extends: plugin/feasibility@1
    brief:
      extends: plugin/requirements@1
    map:
      extends: plugin/planning@1
    shape:
      extends: plugin/design@1
    look:
      extends: plugin/visual-design@1
    build:
      extends: plugin/implementation@1
    explain:
      extends: plugin/documentation@1
    prove:
      extends: plugin/testing@1
    judge:
      extends: plugin/quality@1
    ship:
      extends: plugin/deployment@1
    watch:
      extends: plugin/operations@1
    tend:
      extends: plugin/maintenance@1
    finish:
      extends: plugin/complete@1

defaults:
  runs-on: ubuntu-latest
  package-manager: npm
  provider: fixture
  test-mode: true
  permissions:
    contents: read

workflows:
  delivery:
    name: Example delivery graph
    on:
      workflow_dispatch: {}
    jobs:
      scout:
        name: Check viability
        steps:
          - id: assess
            name: Assess the request
            uses: sdlc.phase
            with:
              definition: scout
          - id: compile
            name: Compile the application
            run: npm run build
      brief:
        name: Establish the contract
        needs: scout
        steps:
          - id: define
            name: Define expected behavior
            uses: sdlc.phase
            with:
              definition: brief
          - id: docs
            name: Check consumer documentation
            run: npm run docs:check
      map:
        name: Choose the route
        needs: brief
        steps:
          - id: organize
            name: Organize the work
            uses: sdlc.phase
            with:
              definition: map
          - id: compile
            name: Compile the planned surface
            run: npm run build
      shape:
        name: Define the structure
        needs: map
        steps:
          - id: structure
            name: Define the implementation structure
            uses: sdlc.phase
            with:
              definition: shape
          - id: compile
            name: Compile the designed surface
            run: npm run build
      look:
        name: Verify presentation
        needs: shape
        steps:
          - id: present
            name: Define the presentation contract
            uses: sdlc.phase
            with:
              definition: look
          - id: visual
            name: Run the visual contract
            run: npm run visual
      build:
        name: Construct the change
        needs: [shape, look]
        steps:
          - id: construct
            name: Construct the requested behavior
            uses: sdlc.phase
            with:
              definition: build
          - id: test
            name: Test the constructed behavior
            run: npm test
      explain:
        name: Explain the change
        needs: build
        steps:
          - id: describe
            name: Describe the resulting behavior
            uses: sdlc.phase
            with:
              definition: explain
          - id: docs
            name: Verify the documentation contract
            run: npm run docs:check
      prove:
        name: Prove the change
        needs: build
        steps:
          - id: exercise
            name: Exercise the resulting behavior
            uses: sdlc.phase
            with:
              definition: prove
          - id: test
            name: Run the deterministic test suite
            run: npm test
      judge:
        name: Apply the release gate
        needs: [explain, prove]
        steps:
          - id: evaluate
            name: Evaluate release readiness
            uses: sdlc.phase
            with:
              definition: judge
          - id: check
            name: Run every consumer check
            run: npm run check
      ship:
        name: Exercise delivery
        needs: judge
        steps:
          - id: deliver
            name: Validate delivery behavior
            uses: sdlc.phase
            with:
              definition: ship
          - id: smoke
            name: Smoke test the preview
            run: npm run smoke
      watch:
        name: Exercise operation
        needs: ship
        steps:
          - id: observe
            name: Validate operational behavior
            uses: sdlc.phase
            with:
              definition: watch
          - id: health
            name: Check preview health
            run: npm run smoke
      tend:
        name: Exercise maintenance
        needs: watch
        steps:
          - id: maintain
            name: Validate maintenance behavior
            uses: sdlc.phase
            with:
              definition: tend
          - id: boundary
            name: Check the package boundary
            run: npm run maintenance
      finish:
        name: Close the graph
        needs: tend
        steps:
          - id: close
            name: Validate completion behavior
            uses: sdlc.phase
            with:
              definition: finish
          - id: check
            name: Run the final consumer proof
            run: npm run check

  request:
    name: Construct a lifecycle canary
    on:
      issues:
        types: [labeled]
    if: github.event.label.name == 'sdlc'
    concurrency:
      group: consumer-canary-${{ github.event.issue.number }}
      cancel-in-progress: false
    jobs:
      construct:
        name: Construct the canary change
        permissions:
          actions: write
          contents: write
          issues: read
          packages: read
          pull-requests: write
        steps:
          - id: ready
            name: Require a ready issue
            uses: sdlc.issue.require-ready
          - id: prepare
            name: Prepare the issue branch
            uses: sdlc.change.prepare
          - id: mutate
            name: Record the canary request
            if: steps.prepare.outputs.state != 'published'
            run: node scripts/write-lifecycle-canary.mjs
          - id: publish
            name: Publish the canary change
            if: steps.prepare.outputs.state != 'published'
            uses: sdlc.change.publish
          - id: pull-request
            name: Ensure the canary pull request
            uses: sdlc.pull-request.ensure
          - id: validate
            name: Dispatch exact-head validation
            uses: sdlc.workflow.dispatch
            with:
              workflow: .github/workflows/sdlc-validation.generated.yml
              ref: base
              inputs: lifecycle

  validation:
    name: Validate a lifecycle canary
    on:
      workflow_dispatch:
        inputs:
          issue: {description: Lifecycle issue, required: true, type: string}
          pull_request: {description: Lifecycle pull request, required: true, type: string}
          branch: {description: Lifecycle head branch, required: true, type: string}
          head_sha: {description: Lifecycle head SHA, required: true, type: string}
          base_sha: {description: Lifecycle base SHA, required: true, type: string}
    concurrency:
      group: consumer-validation-${{ github.event.inputs.branch }}
      cancel-in-progress: false
    jobs:
      check:
        name: Check the exact canary head
        permissions:
          contents: read
          packages: read
        steps:
          - id: check
            name: Run every consumer check
            run: npm run check
      accept:
        name: Accept the exact canary head
        needs: check
        if: always() && needs.check.result == 'success'
        permissions:
          contents: write
          issues: write
          packages: read
          pull-requests: write
        steps:
          - id: merge
            name: Merge the exact tested head
            uses: sdlc.pull-request.merge
          - id: complete
            name: Complete the canary issue
            uses: sdlc.issue.complete
